<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>元素分类</title>
</head>

<body>
  <!-- 块级元素 -->
  <h1>块级元素</h1>文字
  <div>块级元素</div>文字
  <p>块级元素</p>文字

  <!-- 行内元素（内联元素） -->
  <strong>行内元素</strong><strong>行内元素</strong><strong>行内元素</strong>

  <!-- 特殊情况 p里面不能包含其他块级元素 -->
  <p>
  <h1>这样是错误的</h1>
  </p>

  <p>
    <strong>这样是正确的</strong>
  </p>

</body>

</html>
