<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>列表</title>
</head>

<body>
  <h2>无序列表</h2>
  <ul>
    <li>猪爸爸</li>
    <li>猪妈妈</li>
    <li>佩奇</li>
    <li>乔治</li>
  </ul>

  <h2>有序列表</h2>
  <ol>
    <li>周一</li>
    <li>周二</li>
    <li>周三</li>
    <li>周四</li>
  </ol>

  <h3>描述列表</h3>
  <dl>
    <dt>手机</dt>
    <dd>iphone</dd>
    <dd>oppo</dd>
    <dd>vivo</dd>
  </dl>
</body>

</html>
