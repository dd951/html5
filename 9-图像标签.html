<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图像标签</title>
</head>

<body>
  <h2>图像标签的基本使用：</h2>
  <img src="pig.png" alt="猪爸爸">
  <img src="pig.png1" alt="猪爸爸">

  <h2>图像标签修改宽度和高度：</h2>
  <img src="pig.png" alt="猪爸爸" width="300" height="100">
  <img src="pig.png" alt="猪爸爸" width="300">


  <h2>图像标签添加title 图像标题：</h2>
  <img src="pig.png" alt="猪爸爸" width="300" title="猪爸爸">


  <h2> 插入图片不同的格式：</h2>
  <img src="1.jpg" alt="">
  <img src="2.webp" alt="">
  <img src="3.avif" alt="">
  <img src="5.gif" alt="">
  <img src="login.png" alt="">
</body>

</html>
