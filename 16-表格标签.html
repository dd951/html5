<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <!-- 表格标签基本语法 -->
  <table border="1">
    <tr>
      <td>学生</td>
      <td>性别</td>
      <td>年龄</td>
    </tr>
    <tr>
      <td>张三</td>
      <td>男</td>
      <td>11</td>
    </tr>
    <tr>
      <td>小红</td>
      <td>女</td>
      <td>12</td>
    </tr>
  </table>

  <hr>
  <!-- th 表头单元格 -->
  <table border="1">
    <tr>
      <th>学生</th>
      <th>性别</th>
      <th>年龄</th>
    </tr>
    <tr>
      <td>张三</td>
      <td>男</td>
      <td>11</td>
    </tr>
    <tr>
      <td>小红</td>
      <td>女</td>
      <td>12</td>
    </tr>
  </table>

  <hr>
  <!-- 表格结构标签 -->
  <table border="1">
    <thead>
      <tr>
        <th>学生</th>
        <th>性别</th>
        <th>年龄</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>张三</td>
        <td>男</td>
        <td>11</td>
      </tr>
      <tr>
        <td>小红</td>
        <td>女</td>
        <td>12</td>
      </tr>
    </tbody>
  </table>
</body>

</html>
